
{% extends 'cabinet/base.html' %}

{% block content %}

<div class="container mt-4" style="max-width: 1000px;">

    <div class="card shadow-sm border-0" style="border-radius: 14px; overflow: hidden;">

        <!-- Header teal (kif sidebar) -->
        <div class="card-header text-white py-3" style="background-color: #2BB3A3;">
            <h4 class="mb-0">Ajouter un patient</h4>
        </div>

        <div class="card-body p-4">
            <form method="POST">
                {% csrf_token %}

                {{ form.as_p }}

                <div class="d-flex gap-2 mt-4">
                    <!-- Button teal -->
                    <button type="submit" class="btn text-white px-4"
                            style="background-color: #2BB3A3;">
                        Enregistrer
                    </button>
                    <a href="/patients/" class="btn btn-light border px-4">
                        Retour à la liste
                    </a>
                </div>

            </form>
        </div>

    </div>

</div>

{% endblock %}

{% extends 'cabinet/base.html' %}
{% block content %}
<div class="container mt-4" style="max-width: 700px;">
    <div class="card shadow-sm border-0" style="border-radius: 14px; overflow: hidden;">
        <div class="card-header text-white py-3" style="background-color: #2BB3A3;">
            <h4 class="mb-0">Créer un Reçu</h4>
            <small>{{ rdv.patient }} — {{ rdv.date }}</small>
        </div>
        <div class="card-body p-4">
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn text-white px-4"
                            style="background-color: #2BB3A3;">Enregistrer</button>
                    <a href="/rendezvous/" class="btn btn-light border px-4">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
